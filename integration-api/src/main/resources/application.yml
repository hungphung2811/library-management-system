server:
  port: 8089
  shutdown: graceful
  # Không bao giờ lộ stack trace/thông điệp nội bộ ra ngoài.
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false
    include-binding-errors: never
  tomcat:
    # /oauth/token chỉ nhận form nhỏ (grant_type, scope, client_id, client_secret): lớp chặn thứ hai sau nginx.
    max-http-form-post-size: 8KB

spring:
  application:
    name: integration-api
  # Redis chỉ cho bộ đếm giới hạn tốc độ/sử dụng (pha I3). Timeout ngắn: Redis chậm không được giữ request (fail-open).
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 200ms
      connect-timeout: 200ms
      repositories:
        enabled: false
  profiles:
    # Như các service khác (CLAUDE.md): mặc định dev. Ngoài dev (profile prod) cấu hình không an toàn là fail-fast,
    # xem StartupConfigurationCheck. docker-compose chọn profile bằng INTEGRATION_API_PROFILE.
    default: dev
  lifecycle:
    timeout-per-shutdown-phase: 30s
  security:
    oauth2:
      resourceserver:
        jwt:
          # Khóa công khai của identity-service. integration-api chỉ xác thực (chữ ký, exp, iss, aud=lms-integration).
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}

management:
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"

# Khối cấp cao mới đặt ở cuối file; chỉ có một khối `app:`.
app:
  services:
    identity-url: ${IDENTITY_SERVICE_URL:http://localhost:8081}
    catalog-url: ${CATALOG_SERVICE_URL:http://localhost:8082}
    sales-url: ${SALES_SERVICE_URL:http://localhost:8087}
    # Luôn hữu hạn: thiếu/0/âm thì dùng mặc định (2s/5s), tối đa 30s (ServicesProperties).
    connect-timeout: 2s
    read-timeout: 5s
  integration:
    jwt:
      # iss bắt buộc khớp với identity (auth.jwt.issuer, mặc định library-auth-service). Rỗng ngoài dev là lỗi khởi động.
      issuer: ${JWT_ISSUER:library-auth-service}
    # Giới hạn tốc độ theo application bằng Redis (D6, pha I3): cửa sổ cố định 60 giây theo (tenant, application, nhóm
    # endpoint books|inventory|orders). Mặc định TẮT (cần Redis); dev bật bằng INTEGRATION_RATE_LIMIT_ENABLED=true,
    # docker-compose bật sẵn. Redis lỗi thì fail-open (không chặn request), cũng tạm bỏ qua Redis 5 giây.
    rate-limit:
      enabled: ${INTEGRATION_RATE_LIMIT_ENABLED:false}
      default-per-minute: ${INTEGRATION_RATE_LIMIT_PER_MINUTE:600}
    # Thu hồi token tức thời (tùy chọn, mặc định TẮT, cần Redis): từ chối token có jti trong lms:revoked:v1:jti:{jti} hoặc cấp
    # trước dấu lms:revoked:v1:app:{applicationId} do identity ghi (INTEGRATION_REVOCATION_ENABLED ở identity). Fail-open.
    revocation:
      enabled: ${INTEGRATION_REVOCATION_ENABLED:false}
