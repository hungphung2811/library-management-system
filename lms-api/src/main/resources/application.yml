server:
  port: 8085
  shutdown: graceful

spring:
  application:
    name: lms-api
  lifecycle:
    timeout-per-shutdown-phase: 30s
  security:
    oauth2:
      resourceserver:
        jwt:
          # Khóa công khai của identity-service. Chỉ cần xác thực ở đây; phân quyền do từng service nội bộ kiểm.
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}

app:
  services:
    identity-url: ${IDENTITY_SERVICE_URL:http://localhost:8081}
    catalog-url: ${CATALOG_SERVICE_URL:http://localhost:8082}
    circulation-url: ${CIRCULATION_SERVICE_URL:http://localhost:8083}
    support-url: ${SUPPORT_SERVICE_URL:http://localhost:8084}
    system-url: ${SYSTEM_SERVICE_URL:http://localhost:8086}
    sales-url: ${SALES_SERVICE_URL:http://localhost:8087}
    connect-timeout: 2s
    read-timeout: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"

lms:
  api:
    client-ip:
      # IP/CIDR của proxy được tin khi đọc X-Real-IP để gắn nhãn thiết bị cho phiên (ADR-0017). Mặc định chỉ loopback.
      # Sau nginx trong Docker: LMS_API_CLIENT_IP_TRUSTED_PROXIES=172.16.0.0/12. KHÔNG đọc X-Forwarded-For.
      trusted-proxies: ${LMS_API_CLIENT_IP_TRUSTED_PROXIES:127.0.0.0/8,::1/128}
