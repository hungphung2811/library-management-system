# CORS + header bảo mật. Phải include trong từng location vì add_header của location ghi đè cấp server.
add_header Access-Control-Allow-Origin $cors_origin always;
add_header Access-Control-Allow-Credentials true always;
add_header Access-Control-Expose-Headers "X-Correlation-Id" always;
add_header Vary Origin always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy no-referrer always;

if ($request_method = OPTIONS) {
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Credentials true always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Correlation-Id" always;
    add_header Access-Control-Max-Age 3600 always;
    add_header Vary Origin always;
    add_header Content-Length 0;
    return 204;
}
