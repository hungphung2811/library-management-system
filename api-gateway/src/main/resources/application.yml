server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity
              uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/**,/.well-known/**,/api/users/**,/api/departments/**,/api/roles/**,/api/permissions/**,/api/access/**
            - id: catalog
              uri: ${CATALOG_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/books/**,/api/authors/**,/api/publishers/**,/api/categories/**,/api/book-copies/**
            - id: circulation
              uri: ${CIRCULATION_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/borrowings/**,/api/reservations/**,/api/fines/**
            - id: support
              uri: ${SUPPORT_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/notifications/**,/api/audit-logs/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
