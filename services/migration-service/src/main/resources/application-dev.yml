spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8081/.well-known/jwks.json

app:
  security:
    enabled: false

# Dev tắt kiểm quyền theo endpoint cùng với cờ bảo mật ở trên
lms:
  security:
    permission:
      enabled: false

logging:
  level:
    lms.migration: DEBUG
