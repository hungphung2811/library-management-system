spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/sales_db
    username: sales_app
    password: sales_app
  kafka:
    bootstrap-servers: localhost:29092
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8081/.well-known/jwks.json

app:
  security:
    enabled: false
  # Dev/demo: bật cổng thanh toán QR giả lập (ADR-0020). Bí mật dev chỉ để chạy máy cá nhân; đặt
  # PAYMENTS_SANDBOX_WEBHOOK_SECRET để dùng giá trị khác.
  payments:
    sandbox:
      enabled: ${PAYMENTS_SANDBOX_ENABLED:true}
      webhook-secret: ${PAYMENTS_SANDBOX_WEBHOOK_SECRET:dev-only-sandbox-webhook-secret}
    # Khóa test công khai trong mã mẫu chính thức của MoMo (github.com/momo-wallet/payment), chỉ chạy sandbox.
    momo:
      enabled: ${PAYMENTS_MOMO_ENABLED:true}
      partner-code: ${PAYMENTS_MOMO_PARTNER_CODE:MOMOBKUN20180529}
      access-key: ${PAYMENTS_MOMO_ACCESS_KEY:klm05TvNBzhg7h7j}
      secret-key: ${PAYMENTS_MOMO_SECRET_KEY:at67qH6mk8w5Y1nAyMoYKMWACiEi2bsa}

# Dev tắt kiểm quyền theo endpoint cùng với cờ bảo mật ở trên
lms:
  security:
    permission:
      enabled: false
  # Dev: hiện dữ liệu cá nhân đầy đủ ở API nhân viên (prod giữ che)
  privacy:
    mask-personal-data: false

logging:
  level:
    lms.sales: DEBUG
