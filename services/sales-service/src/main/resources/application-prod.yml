spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWT_JWK_SET_URI}

lms:
  security:
    permission:
      internal-api-key: ${INTERNAL_API_KEY}

logging:
  level:
    root: INFO

# Prod giữ che dữ liệu cá nhân (lms.privacy.mask-personal-data=true, mặc định); không đặt false ở prod

# Cổng thanh toán QR giả lập (ADR-0020) luôn tắt ở prod, không đọc từ biến môi trường để tránh bật nhầm
app:
  payments:
    sandbox:
      enabled: false
