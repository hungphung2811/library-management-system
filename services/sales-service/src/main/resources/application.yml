server:
  port: 8087
  shutdown: graceful

spring:
  application:
    name: sales-service
  profiles:
    default: dev
  lifecycle:
    timeout-per-shutdown-phase: 30s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # Nhập Excel (ADR-0024 3.6): chèn mặt hàng/nhà cung cấp theo lô JDBC (id gán sẵn nên không cần SELECT)
        jdbc.batch_size: 100
        order_inserts: true
  servlet:
    multipart:
      # Nhập Excel (ADR-0024): file tối đa 5 MB, cả request 6 MB (khớp nginx). Vượt thì 413 IMPORT_FILE_TOO_LARGE
      max-file-size: 5MB
      max-request-size: 6MB
  flyway:
    # Migration do system-service chạy tập trung (target sales); service chỉ validate schema (ddl-auto: validate)
    enabled: false
  # Cache GET cài đặt/nhà cung cấp (cache-common). Timeout ngắn để Redis chết không làm chậm request
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 200ms
      connect-timeout: 200ms
      repositories:
        enabled: false
  kafka:
    producer:
      properties:
        # Không chặn request lâu khi broker sự cố; publish là best-effort (xem KafkaEventPublisher)
        max.block.ms: 2000

management:
  health:
    # Redis chỉ là cache phụ: chết không được làm service DOWN
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"

app:
  security:
    # Mặc định bật xác thực JWT; chỉ profile dev tắt (application-dev.yml)
    enabled: true

  kafka:
    topics:
      sales-events: ${SALES_EVENTS_TOPIC:sales.events}
    topic-partitions: ${SALES_EVENTS_PARTITIONS:3}
    topic-replicas: ${SALES_EVENTS_REPLICAS:1}

  # Thanh toán QR bằng cổng GIẢ LẬP nội bộ cho POS (ADR-0020). KHÔNG dùng cho production: mặc định tắt (QR bị từ chối,
  # webhook và nút giả lập trả 404); dev bật ở application-dev.yml. Bí mật ký webhook đọc từ biến môi trường.
  payments:
    sandbox:
      enabled: ${PAYMENTS_SANDBOX_ENABLED:false}
      webhook-secret: ${PAYMENTS_SANDBOX_WEBHOOK_SECRET:}
      # Tài khoản/ngân hàng demo in vào mã VietQR (BIN 970422 = MB, chỉ để minh họa)
      bank-bin: ${PAYMENTS_SANDBOX_BANK_BIN:970422}
      account-no: ${PAYMENTS_SANDBOX_ACCOUNT_NO:0123456789}
      account-name: ${PAYMENTS_SANDBOX_ACCOUNT_NAME:LMS DEMO}
      intent-ttl-minutes: ${PAYMENTS_SANDBOX_INTENT_TTL_MINUTES:10}
    # Cổng MoMo sandbox (https://test-payment.momo.vn): mặc định tắt; khóa đọc từ biến môi trường (dev có khóa test công khai
    # của MoMo ở application-dev.yml). Kết quả lấy bằng truy vấn MoMo khi FE thăm dò, không cần IPN.
    momo:
      enabled: ${PAYMENTS_MOMO_ENABLED:false}
      endpoint: ${PAYMENTS_MOMO_ENDPOINT:https://test-payment.momo.vn}
      partner-code: ${PAYMENTS_MOMO_PARTNER_CODE:}
      access-key: ${PAYMENTS_MOMO_ACCESS_KEY:}
      secret-key: ${PAYMENTS_MOMO_SECRET_KEY:}
      redirect-url: ${PAYMENTS_MOMO_REDIRECT_URL:https://example.com/momo/return}
      ipn-url: ${PAYMENTS_MOMO_IPN_URL:https://example.com/momo/ipn}
    # Cổng SePay Test mode (ADR-0028): mặc định tắt, dò sổ giao dịch bằng API sandbox khi FE thăm dò (không webhook). Token
    # Test mode (my.sepay.vn > Test mode > API Access) và tài khoản chỉ lấy từ biến môi trường, KHÔNG commit giá trị thật.
    sepay:
      enabled: ${PAYMENTS_SEPAY_ENABLED:false}
      endpoint: ${PAYMENTS_SEPAY_ENDPOINT:https://userapi-sandbox.sepay.vn}
      token: ${PAYMENTS_SEPAY_TOKEN:}
      bank-bin: ${PAYMENTS_SEPAY_BANK_BIN:}
      account-no: ${PAYMENTS_SEPAY_ACCOUNT_NO:}
      account-name: ${PAYMENTS_SEPAY_ACCOUNT_NAME:LMS SEPAY TEST}
      bank-account-id: ${PAYMENTS_SEPAY_BANK_ACCOUNT_ID:}
      # Bộ hãm lời gọi dò SePay (ADR-0029): mỗi lệnh tối đa 1 lần/khoảng này, toàn cục tối đa N lần/giây (SePay giới hạn 3/giây/IP)
      min-query-interval-ms: ${PAYMENTS_SEPAY_MIN_QUERY_INTERVAL_MS:5000}
      max-queries-per-second: ${PAYMENTS_SEPAY_MAX_QPS:2}
    # Thanh toán trực tuyến cho website khách (ADR-0029): SEPAY chỉ mở khi cờ này bật VÀ cổng SePay ở trên bật. Mặc định tắt
    # để bật SePay cho POS không tự mở tài khoản Test mode dùng chung ra mọi website tenant.
    online:
      sepay-enabled: ${PAYMENTS_ONLINE_SEPAY_ENABLED:false}
      # Hạn thanh toán và giữ tồn của đơn online chờ thanh toán (phút)
      intent-ttl-minutes: ${PAYMENTS_ONLINE_INTENT_TTL_MINUTES:15}
    # Thu tay tại quầy (CASH, CARD, BANK_TRANSFER, ADR-0021): lệnh chờ thu ngân xác nhận, hết hạn thì nhả tồn
    manual:
      intent-ttl-minutes: ${PAYMENTS_MANUAL_INTENT_TTL_MINUTES:10}
    # Job dọn lệnh quá hạn (mọi phương thức)
    expire-delay-ms: 60000
    expire-batch-size: 100
    expire-job-enabled: true

# Middleware phân quyền theo endpoint (security-common): khóa Controller/method được đăng ký về identity-service
lms:
  security:
    permission:
      service-name: ${spring.application.name}
      identity-base-url: ${IDENTITY_SERVICE_URL:http://localhost:8081}
      internal-api-key: ${INTERNAL_API_KEY:}
      # Endpoint thường bắt buộc token có claim tenantId (403 TENANT_REQUIRED)
      require-tenant: true
  # tenant-common: TenantContext theo claim tenantId, Hibernate @TenantId và RLS (app.tenant_id)
  tenant:
    enabled: true
  # Gọi catalog bằng token người dùng chuyển tiếp (ADR-0010 2.2); dùng từ B1.3
  sales:
    catalog:
      base-url: ${CATALOG_SERVICE_URL:http://localhost:8082}
    # Liên hệ của khách (ADR-0015 mục 2.7): chống spam theo người, cấu hình nền tảng (không theo tenant)
    contact:
      max-per-user-per-day: 5
      duplicate-window: PT10M
    # Chống lạm dụng đặt hàng online (docs/security/ORDER_ABUSE_AUDIT.md). defaults.* là giá trị cho tenant chưa cấu hình
    # (tenant tự đổi qua PUT /internal/sales/settings/order-abuse-policy); reservation-minutes 0 = không hết hạn.
    abuse:
      reservation-expiry-job-enabled: true
      reservation-expiry-delay-ms: 30000
      reservation-expiry-batch-size: 100
      # Ngưỡng chấm rủi ro (AntiAbuseService): tỷ lệ hủy % trong 30 ngày, chỉ xét khi có từ min-orders đơn
      risk:
        min-orders: 5
        cancel-percent-medium: 30
        cancel-percent-high: 50
        cancel-percent-critical: 80
      defaults:
        reservation-minutes: ${LMS_ABUSE_RESERVATION_MINUTES:15}
        max-pending-orders: ${LMS_ABUSE_MAX_PENDING_ORDERS:5}
        max-orders-per-day: ${LMS_ABUSE_MAX_ORDERS_PER_DAY:20}
        max-quantity-per-line: ${LMS_ABUSE_MAX_QUANTITY_PER_LINE:50}
        max-total-quantity: ${LMS_ABUSE_MAX_TOTAL_QUANTITY:100}
        orders-per-minute-per-user: ${LMS_ABUSE_ORDERS_PER_MINUTE_PER_USER:5}
        orders-per-minute-tenant: ${LMS_ABUSE_ORDERS_PER_MINUTE_TENANT:300}
    # Log vận hành lưu DB (ADR-0029): dòng log kênh tích hợp/hệ thống vào bảng integration_log_events để màn hình xem/lọc
    logs:
      retention-days: ${LMS_SALES_LOGS_RETENTION_DAYS:30}
      persist:
        enabled: ${LMS_SALES_LOGS_PERSIST_ENABLED:true}
        queue-capacity: 5000
        batch-size: 200
        # Kênh SYSTEM chọn lọc: chỉ lưu từ mức này trở lên (hoặc dòng có anomaly)
        system-min-level: WARN
      purge:
        enabled: true
        cron: "0 15 3 * * *"
        batch-size: 1000
  # Che dữ liệu cá nhân ở API nhân viên (đơn, liên hệ): true = che (mặc định, bắt buộc ở prod); dev tắt ở application-dev.yml
  privacy:
    mask-personal-data: ${LMS_PRIVACY_MASK_PERSONAL_DATA:true}
