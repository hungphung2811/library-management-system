server:
  port: 8087
  shutdown: graceful

spring:
  application:
    name: sales-service
  profiles:
    default: dev
  lifecycle:
    timeout-per-shutdown-phase: 30s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    # Migration do system-service chạy tập trung (target sales); service chỉ validate schema (ddl-auto: validate)
    enabled: false
  # Cache GET cài đặt/nhà cung cấp (cache-common). Timeout ngắn để Redis chết không làm chậm request
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 200ms
      connect-timeout: 200ms
      repositories:
        enabled: false
  kafka:
    producer:
      properties:
        # Không chặn request lâu khi broker sự cố; publish là best-effort (xem KafkaEventPublisher)
        max.block.ms: 2000

management:
  health:
    # Redis chỉ là cache phụ: chết không được làm service DOWN
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"

app:
  security:
    # Mặc định bật xác thực JWT; chỉ profile dev tắt (application-dev.yml)
    enabled: true

  kafka:
    topics:
      sales-events: ${SALES_EVENTS_TOPIC:sales.events}
    topic-partitions: ${SALES_EVENTS_PARTITIONS:3}
    topic-replicas: ${SALES_EVENTS_REPLICAS:1}

  # Thanh toán QR bằng cổng GIẢ LẬP nội bộ cho POS (ADR-0020). KHÔNG dùng cho production: mặc định tắt (QR bị từ chối,
  # webhook và nút giả lập trả 404); dev bật ở application-dev.yml. Bí mật ký webhook đọc từ biến môi trường.
  payments:
    sandbox:
      enabled: ${PAYMENTS_SANDBOX_ENABLED:false}
      webhook-secret: ${PAYMENTS_SANDBOX_WEBHOOK_SECRET:}
      # Tài khoản/ngân hàng demo in vào mã VietQR (BIN 970422 = MB, chỉ để minh họa)
      bank-bin: ${PAYMENTS_SANDBOX_BANK_BIN:970422}
      account-no: ${PAYMENTS_SANDBOX_ACCOUNT_NO:0123456789}
      account-name: ${PAYMENTS_SANDBOX_ACCOUNT_NAME:LMS DEMO}
      intent-ttl-minutes: ${PAYMENTS_SANDBOX_INTENT_TTL_MINUTES:10}
    # Cổng MoMo sandbox (https://test-payment.momo.vn): mặc định tắt; khóa đọc từ biến môi trường (dev có khóa test công khai
    # của MoMo ở application-dev.yml). Kết quả lấy bằng truy vấn MoMo khi FE thăm dò, không cần IPN.
    momo:
      enabled: ${PAYMENTS_MOMO_ENABLED:false}
      endpoint: ${PAYMENTS_MOMO_ENDPOINT:https://test-payment.momo.vn}
      partner-code: ${PAYMENTS_MOMO_PARTNER_CODE:}
      access-key: ${PAYMENTS_MOMO_ACCESS_KEY:}
      secret-key: ${PAYMENTS_MOMO_SECRET_KEY:}
      redirect-url: ${PAYMENTS_MOMO_REDIRECT_URL:https://example.com/momo/return}
      ipn-url: ${PAYMENTS_MOMO_IPN_URL:https://example.com/momo/ipn}
    # Thu tay tại quầy (CASH, CARD, BANK_TRANSFER, ADR-0021): lệnh chờ thu ngân xác nhận, hết hạn thì nhả tồn
    manual:
      intent-ttl-minutes: ${PAYMENTS_MANUAL_INTENT_TTL_MINUTES:10}
    # Job dọn lệnh quá hạn (mọi phương thức)
    expire-delay-ms: 60000
    expire-batch-size: 100
    expire-job-enabled: true

# Middleware phân quyền theo endpoint (security-common): khóa Controller/method được đăng ký về identity-service
lms:
  security:
    permission:
      service-name: ${spring.application.name}
      identity-base-url: ${IDENTITY_SERVICE_URL:http://localhost:8081}
      internal-api-key: ${INTERNAL_API_KEY:}
      # Endpoint thường bắt buộc token có claim tenantId (403 TENANT_REQUIRED)
      require-tenant: true
  # tenant-common: TenantContext theo claim tenantId, Hibernate @TenantId và RLS (app.tenant_id)
  tenant:
    enabled: true
  # Gọi catalog bằng token người dùng chuyển tiếp (ADR-0010 2.2); dùng từ B1.3
  sales:
    catalog:
      base-url: ${CATALOG_SERVICE_URL:http://localhost:8082}
    # Liên hệ của khách (ADR-0015 mục 2.7): chống spam theo người, cấu hình nền tảng (không theo tenant)
    contact:
      max-per-user-per-day: 5
      duplicate-window: PT10M
  # Che dữ liệu cá nhân ở API nhân viên (đơn, liên hệ): true = che (mặc định, bắt buộc ở prod); dev tắt ở application-dev.yml
  privacy:
    mask-personal-data: ${LMS_PRIVACY_MASK_PERSONAL_DATA:true}
