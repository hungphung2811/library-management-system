server:
  port: 8083
  shutdown: graceful

spring:
  application:
    name: circulation-service
  profiles:
    default: dev
  lifecycle:
    timeout-per-shutdown-phase: 30s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    # Migration do system-service chạy tập trung; service chỉ validate schema (ddl-auto: validate)
    enabled: false
  kafka:
    producer:
      properties:
        # Không chặn request lâu khi broker sự cố; publish là best-effort (xem KafkaEventPublisher)
        max.block.ms: 2000
    consumer:
      group-id: circulation-service
      auto-offset-reset: earliest

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

app:
  security:
    # Mặc định bật xác thực JWT; chỉ profile dev tắt (application-dev.yml)
    enabled: true

  kafka:
    topics:
      borrowing-events: borrowing.events
      fine-events: fine.events
      reservation-events: reservation.events
      inventory-events: inventory.events
      # Vòng đời tenant do identity-service phát (TenantCreated, TenantStatusChanged), hợp đồng Task 6
      identity-events: identity-events
  reservation:
    # UC14: chạy đầu mỗi ngày (cron 6 trường)
    expire-cron: "0 5 0 * * *"
  # Mức phạt (QĐ3, QĐ4): đổi ở đây không cần sửa code. Hạn mức mượn theo loại độc giả nằm ở bảng borrow_rules.
  fine:
    late-fee-per-day: 5000
    damaged-rate: 0.5
    lost-rate: 1.5
  # Gọi đồng bộ sang service khác để kiểm tra đặt trước (QĐ2: identity, QĐ5: catalog)
  clients:
    catalog:
      base-url: ${CATALOG_SERVICE_URL:http://localhost:8082}
    identity:
      base-url: ${IDENTITY_SERVICE_URL:http://localhost:8081}

# Middleware phân quyền theo endpoint (security-common): khóa Controller/method được đăng ký về identity-service
lms:
  security:
    permission:
      service-name: ${spring.application.name}
      identity-base-url: ${IDENTITY_SERVICE_URL:http://localhost:8081}
      internal-api-key: ${INTERNAL_API_KEY:}
      # Endpoint thường bắt buộc token có claim tenantId (403 TENANT_REQUIRED); @AuthenticatedOnly/@PublicEndpoint
      # không bị ảnh hưởng.
      require-tenant: true
  # tenant-common: TenantContext theo claim tenantId, Hibernate @TenantId và RLS (app.tenant_id)
  tenant:
    enabled: true
