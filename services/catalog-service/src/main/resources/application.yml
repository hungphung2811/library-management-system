server:
  port: 8082
  shutdown: graceful
  tomcat:
    # Nhập Excel (ADR-0024): nuốt hết phần thân vượt giới hạn để client nhận 413 JSON thay vì đứt kết nối
    max-swallow-size: 7MB

spring:
  application:
    name: catalog-service
  profiles:
    default: dev
  lifecycle:
    timeout-per-shutdown-phase: 30s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # Nhập Excel ghi theo chunk 200 dòng bằng persist: gom INSERT thành batch JDBC (ADR-0024 mục 3.6)
        jdbc.batch_size: 100
        order_inserts: true
  servlet:
    multipart:
      # Nhập Excel (ADR-0024): file tối đa 5 MB, cả request 6 MB
      max-file-size: 5MB
      max-request-size: 6MB
  flyway:
    # Migration do system-service chạy tập trung; service chỉ validate schema (ddl-auto: validate)
    enabled: false
  # Cache danh mục tham chiếu: Lettuce tự nối lại; timeout ngắn để Redis chết không làm chậm request
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 200ms
      connect-timeout: 200ms
      repositories:
        enabled: false
  kafka:
    producer:
      properties:
        # Không chặn request lâu khi broker sự cố; publish là best-effort (xem KafkaEventPublisher)
        max.block.ms: 2000
    consumer:
      group-id: catalog-service
      auto-offset-reset: earliest

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # Redis chỉ là cache phụ: Redis chết không được làm service DOWN
    redis:
      enabled: false

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"

app:
  security:
    # Mặc định bật xác thực JWT; chỉ profile dev tắt (application-dev.yml)
    enabled: true

  kafka:
    topics:
      inventory-events: inventory.events
      reservation-events: reservation.events

# Middleware phân quyền theo endpoint (security-common): khóa Controller/method được đăng ký về identity-service
lms:
  security:
    permission:
      service-name: ${spring.application.name}
      identity-base-url: ${IDENTITY_SERVICE_URL:http://localhost:8081}
      internal-api-key: ${INTERNAL_API_KEY:}
      # Endpoint thường bắt buộc token có claim tenantId (403 TENANT_REQUIRED)
      require-tenant: true
  # tenant-common: TenantContext theo claim tenantId, Hibernate @TenantId và RLS (app.tenant_id)
  tenant:
    enabled: true
