server:
  port: 8082
  shutdown: graceful

spring:
  application:
    name: catalog-service
  profiles:
    default: dev
  lifecycle:
    timeout-per-shutdown-phase: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

# Database sở hữu riêng của service: catalog_db
# TODO: cấu hình datasource, Flyway, Kafka khi bắt đầu hiện thực service.
