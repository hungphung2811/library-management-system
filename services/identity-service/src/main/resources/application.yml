server:
  port: 8081
  shutdown: graceful

spring:
  application:
    name: identity-service
  profiles:
    default: dev
  lifecycle:
    timeout-per-shutdown-phase: 30s
  servlet:
    multipart:
      # Nhập Excel (ADR-0024): file tối đa 5 MB, cả request 6 MB (khớp nginx/lms-api); vượt thì 413 IMPORT_FILE_TOO_LARGE
      max-file-size: 5MB
      max-request-size: 6MB
  # SMTP gửi OTP xác minh email: mặc định Mailpit của docker-compose (localhost:1025, thư không ra ngoài)
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.connectiontimeout: 3000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    # Migration do system-service chạy tập trung; service chỉ validate schema (ddl-auto: validate)
    enabled: false
  kafka:
    producer:
      properties:
        # Không chặn request lâu khi broker sự cố; publish là best-effort (xem KafkaEventPublisher)
        max.block.ms: 2000
    consumer:
      group-id: identity-service
      auto-offset-reset: latest
  # Cache request (cache-common): timeout ngắn để Redis chết không làm chậm request
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 200ms
      connect-timeout: 200ms
      repositories:
        enabled: false

management:
  health:
    # Redis chỉ là cache phụ: Redis chết không được làm identity-service DOWN
    redis:
      enabled: false
    # SMTP chỉ phục vụ gửi OTP: SMTP chết không được làm identity-service DOWN
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"

auth:
  jwt:
    issuer: library-auth-service
    access-token-ttl: PT15M
    # PEM PKCS#8 / X.509. Bỏ trống thì sinh khóa tạm mỗi lần chạy (chỉ dùng cho dev).
    private-key-pem: ${AUTH_JWT_PRIVATE_KEY:}
    public-key-pem: ${AUTH_JWT_PUBLIC_KEY:}
    # Chỉ dùng trong cửa sổ xoay khóa ký: khóa công khai CŨ (X.509 PEM) vẫn được đưa vào JWKS (kid riêng) để token đã ký
    # bằng khóa cũ còn xác minh được. Bỏ trống = JWKS chỉ có một khóa. Quy trình: docs/architecture/JWT_KEY_ROTATION.md.
    previous-public-key-pem: ${AUTH_JWT_PREVIOUS_PUBLIC_KEY:}
    # Bỏ trống PEM ngoài profile dev/test/demo-seed thì identity KHÔNG khởi động, trừ khi bật cờ này (chỉ demo:
    # khóa tạm mất hiệu lực mỗi lần khởi động lại). Production phải đặt AUTH_JWT_PRIVATE_KEY/PUBLIC_KEY và để cờ tắt.
    allow-ephemeral-key: ${AUTH_JWT_ALLOW_EPHEMERAL_KEY:false}
  refresh-token-ttl: P7D
  # ADR-0017: token đã xoay dùng lại trong cửa sổ này (race nhiều tab) chỉ nhận 401 REFRESH_TOKEN_SUPERSEDED, không phát
  # token và không thu hồi gì. PT0S = tắt (luôn thu hồi phiên); tối đa PT2M (khởi động từ chối giá trị lớn hơn).
  refresh-reuse-grace: PT30S
  bootstrap-admin:
    user-id: 00000000-0000-0000-0000-000000000001
    username: admin
    password: ${AUTH_BOOTSTRAP_ADMIN_PASSWORD:}
    # Mặc định bắt buộc đổi mật khẩu ở lần đăng nhập đầu; profile dev tắt để dùng admin / Admin@12345 ngay
    must-change-password: true
    # Tenant của tài khoản quản trị khởi tạo: tenant mặc định do migration V11 tạo (id chỉ nằm ở cấu hình/migration)
    tenant-id: ${AUTH_BOOTSTRAP_ADMIN_TENANT_ID:00000000-0000-0000-0000-0000000000d1}
  # Tài khoản người vận hành (credentials.platform_admin, không thuộc tenant nào). Bỏ trống thì không tạo.
  bootstrap:
    platform-admin-username: ${AUTH_BOOTSTRAP_PLATFORM_ADMIN_USERNAME:}
    platform-admin-password: ${AUTH_BOOTSTRAP_PLATFORM_ADMIN_PASSWORD:}
  # Đăng nhập ngoài (OIDC). Nhà cung cấp chỉ bật khi có client-id; redirect URI đăng ký ở IdP:
  #   <public-base-url>/external/<tên>/callback (dev: http://localhost:8080/api/auth/external/google/callback)
  external:
    public-base-url: ${AUTH_EXTERNAL_PUBLIC_BASE_URL:http://localhost:8080/api/auth}
    allowed-return-origins: ${AUTH_EXTERNAL_ALLOWED_RETURN_ORIGINS:http://localhost:3000,http://localhost:5173}
    state-secret: ${AUTH_EXTERNAL_STATE_SECRET:}
    cookie-secure: ${AUTH_EXTERNAL_COOKIE_SECURE:false}
    providers:
      google:
        display-name: Google
        authority: https://accounts.google.com
        client-id: ${GOOGLE_CLIENT_ID:}
        client-secret: ${GOOGLE_CLIENT_SECRET:}
        scopes: openid email profile
        # Rỗng = không giới hạn tên miền email khi tự liên kết
        allowed-email-domains: ${GOOGLE_ALLOWED_EMAIL_DOMAINS:}

app:
  # Khóa chia sẻ cho API nội bộ /internal/**: các service báo khóa quyền của endpoint về identity. Bỏ trống = đóng.
  internal-api-key: ${INTERNAL_API_KEY:}
  kafka:
    topics:
      access-events: access-control.events
      auth-events: auth.events
      # Vòng đời tenant (TenantCreated, TenantStatusChanged) + audit thao tác nền tảng; circulation nghe topic này
      identity-events: identity-events
      # Quên mật khẩu: mang token thô cho kênh gửi thư; tách khỏi auth.events để audit không lưu token
      password-reset-events: auth.password-reset

# Middleware phân quyền theo endpoint (security-common). identity ghi khóa thẳng vào DB của mình.
lms:
  security:
    permission:
      service-name: ${spring.application.name}
      # Endpoint thường bắt buộc token có claim tenantId (403 TENANT_REQUIRED); @AuthenticatedOnly/@PublicEndpoint
      # (đăng nhập, làm mới, đổi tenant, /me/tenants, đổi mật khẩu) không bị ảnh hưởng.
      require-tenant: true
  # tenant-common: TenantContext theo claim tenantId, Hibernate @TenantId và RLS (app.tenant_id)
  tenant:
    enabled: true
  # Storefront công khai (ADR-0011): bí mật riêng của customer-api (KHÔNG dùng INTERNAL_API_KEY), bỏ trống = từ chối mọi lời gọi
  identity:
    storefront:
      client-secret: ${STOREFRONT_CLIENT_SECRET:}
      token-ttl: PT5M
      # ADR-0013: origin storefront theo tenant. http chỉ cho localhost/127.0.0.1 trừ khi bật cờ (staging không TLS)
      max-origins-per-tenant: 10
      allow-http-origins: ${STOREFRONT_ALLOW_HTTP_ORIGINS:false}
    # Xác minh email bằng OTP cho khách tự đăng ký (audit A3). Tắt (enabled=false) = hành vi cũ: tài khoản mới coi như đã xác minh.
    # otp-secret: khóa HMAC băm OTP (biến môi trường EMAIL_VERIFICATION_OTP_SECRET, KHÔNG đặt trong repo); trống = chỉ băm theo muối.
    email-verification:
      enabled: ${EMAIL_VERIFICATION_ENABLED:true}
      otp-ttl: ${EMAIL_VERIFICATION_OTP_TTL:PT10M}
      max-attempts: ${EMAIL_VERIFICATION_MAX_ATTEMPTS:5}
      resend-min-interval: ${EMAIL_VERIFICATION_RESEND_INTERVAL:PT60S}
      max-sends-per-day: ${EMAIL_VERIFICATION_MAX_SENDS_PER_DAY:5}
      from: ${EMAIL_VERIFICATION_FROM:no-reply@lms.local}
      otp-secret: ${EMAIL_VERIFICATION_OTP_SECRET:}
    # Token tích hợp OAuth2 client_credentials (SaaS API Authentication pha I2, Q10): TTL access token
    integration:
      token-ttl: ${INTEGRATION_TOKEN_TTL:PT5M}
      # Thu hồi tức thời: tạm ngưng/xóa Application hoặc thu hồi credential COMPROMISED thì ghi dấu vào Redis
      # (lms:revoked:v1:app:{id}) để integration-api từ chối token đã cấp. Mặc định tắt; marker-ttl phải lớn hơn token-ttl.
      revocation:
        enabled: ${INTEGRATION_REVOCATION_ENABLED:false}
        marker-ttl: ${INTEGRATION_REVOCATION_MARKER_TTL:PT1H}

  # Hợp đồng thuê dịch vụ theo tenant (ADR-0012): múi giờ nghiệp vụ, ân hạn sau ngày kết thúc, mốc nhắc hạn (ngày),
  # job vòng đời mỗi giờ (phút 7). Tắt job: lms.contract.job.enabled=false.
  contract:
    zone: Asia/Ho_Chi_Minh
    grace-period: P7D
    reminder-days: [30, 7, 1]
    job:
      enabled: true
      cron: "0 7 * * * *"

  # Dọn refresh token hết hạn quá 1 ngày mỗi ngày 03:30 (ADR-0017); batch-size = số dòng xóa mỗi lô.
  auth:
    refresh-cleanup:
      cron: "0 30 3 * * *"
      batch-size: 1000

  # Thông báo theo sự kiện (ADR-0030): bí mật riêng của support-service để tra email người nhận qua
  # POST /internal/notification-recipients/lookup (KHÔNG dùng INTERNAL_API_KEY). Bỏ trống = từ chối mọi lời gọi.
  notification:
    client-secret: ${NOTIFICATION_CLIENT_SECRET:}
