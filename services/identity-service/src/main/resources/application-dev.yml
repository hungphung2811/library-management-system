spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/identity_db
    username: identity_app
    password: identity_app
  kafka:
    bootstrap-servers: localhost:29092

auth:
  bootstrap-admin:
    # Chỉ dùng ở dev. Đăng nhập: admin / Admin@12345
    password: Admin@12345
    must-change-password: false

app:
  internal-api-key: dev-internal-key

logging:
  level:
    lms.identity: DEBUG

lms:
  identity:
    password-reset:
      # Chưa có dịch vụ gửi thư: ghi token đặt lại mật khẩu ra log INFO (chỉ dev; mặc định tắt)
      log-token: true
