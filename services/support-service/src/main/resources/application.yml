server:
  port: 8084
  shutdown: graceful

spring:
  application:
    name: support-service
  profiles:
    default: dev
  lifecycle:
    timeout-per-shutdown-phase: 30s
  # Nguồn dữ liệu do database-common quản lý (database.connections.*), nên tắt các auto-config mặc định
  # để không xung đột: DataSource/Hibernate/Flyway/Mongo/Repository tự cấu hình.
  # Flyway không chạy trong service này: schema AUDIT_DB do system-service tạo (chạy trước khi service khởi động).
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
      - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoRepositoriesAutoConfiguration
  kafka:
    consumer:
      group-id: support-service
      auto-offset-reset: earliest

database:
  # true: lỗi mở connection critical làm app dừng. LOG_DB là connection phụ nên chỉ ghi nhận FAILED.
  fail-on-startup-error: true
  connections:
    AUDIT_DB:
      type: POSTGRESQL
      critical: true
      entity-packages:
        - lms.support.audit.infrastructure.persistence
        - lms.support.notification.infrastructure.persistence
      jpa-properties:
        # Không tự sinh/validate schema ở đây: schema do system-service quản lý.
        hibernate.hbm2ddl.auto: none
        # @TenantId của AuditLogJpaEntity lọc theo TenantContext (không có tenant: UUID nil, không khớp dòng nào)
        hibernate.tenant_identifier_resolver: lms.tenant.TenantIdentifierResolver
    LOG_DB:
      type: MONGODB
      critical: false
      retry:
        max-attempts: 2
        backoff: 500ms

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"

app:
  security:
    enabled: true

  kafka:
    topics:
      auth-events: auth.events
      access-events: access-control.events
      borrowing-events: borrowing.events
      reservation-events: reservation.events
      # Vòng đời tenant + PlatformOperationPerformed (tenantId = tenant bị tác động) vào audit_logs
      identity-events: identity-events

# Middleware phân quyền theo endpoint (security-common): khóa Controller/method được đăng ký về identity-service
lms:
  security:
    permission:
      service-name: ${spring.application.name}
      identity-base-url: ${IDENTITY_SERVICE_URL:http://localhost:8081}
      internal-api-key: ${INTERNAL_API_KEY:}
      # Endpoint bắt buộc token có claim tenantId (403 TENANT_REQUIRED)
      require-tenant: true
  # tenant-common: TenantContext theo claim tenantId, Hibernate @TenantId và RLS (app.tenant_id)
  tenant:
    enabled: true
