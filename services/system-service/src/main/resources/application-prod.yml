spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWT_JWK_SET_URI}

lms:
  security:
    permission:
      internal-api-key: ${INTERNAL_API_KEY}

logging:
  level:
    root: INFO
