# Lớp phủ triển khai một lệnh: docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile apps up -d --build
# (hoặc scripts/deploy.sh). Thêm web (FE) ở cổng WEB_PORT, tự khởi động lại, ép khóa JWT cố định, bỏ cổng DB/Kafka ra host.
services:
  web:
    profiles: [apps, core]
    build:
      context: ${FE_DIR:-../library-management-system-fe}
      dockerfile_inline: |
        FROM node:22-alpine AS build
        WORKDIR /app
        COPY package.json package-lock.json ./
        RUN npm ci
        COPY . .
        RUN npx vite build
        FROM nginx:1.27-alpine
        COPY --from=webconf nginx.conf /etc/nginx/conf.d/default.conf
        COPY --from=build /app/dist /usr/share/nginx/html
      additional_contexts:
        webconf: ./infrastructure/web
    mem_limit: 64m
    depends_on: [nginx]
    ports:
      - "${WEB_PORT:-80}:80"
    restart: unless-stopped

  nginx:
    restart: unless-stopped
    ports: !override []

  identity-service:
    restart: unless-stopped
    environment:
      AUTH_JWT_ALLOW_EPHEMERAL_KEY: "false"
      AUTH_BOOTSTRAP_ADMIN_PASSWORD: ${AUTH_BOOTSTRAP_ADMIN_PASSWORD:?đặt AUTH_BOOTSTRAP_ADMIN_PASSWORD trong .env}
      AUTH_JWT_PRIVATE_KEY: ${AUTH_JWT_PRIVATE_KEY:?đặt AUTH_JWT_PRIVATE_KEY trong .env}
      AUTH_JWT_PUBLIC_KEY: ${AUTH_JWT_PUBLIC_KEY:?đặt AUTH_JWT_PUBLIC_KEY trong .env}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?đặt INTERNAL_API_KEY trong .env}
      STOREFRONT_CLIENT_SECRET: ${STOREFRONT_CLIENT_SECRET:?đặt STOREFRONT_CLIENT_SECRET trong .env}
      TENANT_DATA_ENCRYPTION_KEY: ${TENANT_DATA_ENCRYPTION_KEY:?đặt TENANT_DATA_ENCRYPTION_KEY trong .env}
      EMAIL_VERIFICATION_OTP_SECRET: ${EMAIL_VERIFICATION_OTP_SECRET:?đặt EMAIL_VERIFICATION_OTP_SECRET trong .env}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}

  sales-service:
    restart: unless-stopped
    environment:
      PAYMENTS_SEPAY_ENABLED: ${PAYMENTS_SEPAY_ENABLED:-false}
      PAYMENTS_SEPAY_TOKEN: ${PAYMENTS_SEPAY_TOKEN:-}
      PAYMENTS_SEPAY_BANK_BIN: ${PAYMENTS_SEPAY_BANK_BIN:-}
      PAYMENTS_SEPAY_ACCOUNT_NO: ${PAYMENTS_SEPAY_ACCOUNT_NO:-}
      PAYMENTS_SEPAY_BANK_ACCOUNT_ID: ${PAYMENTS_SEPAY_BANK_ACCOUNT_ID:-}

  customer-api:
    restart: unless-stopped
    environment:
      STOREFRONT_CLIENT_SECRET: ${STOREFRONT_CLIENT_SECRET:?đặt STOREFRONT_CLIENT_SECRET trong .env}

  system-service: { restart: unless-stopped }
  catalog-service: { restart: unless-stopped }
  circulation-service: { restart: unless-stopped }
  support-service: { restart: unless-stopped }
  lms-api: { restart: unless-stopped }
  postgres: { restart: unless-stopped, ports: !override [] }
  kafka: { restart: unless-stopped, ports: !override [] }
  redis: { restart: unless-stopped, ports: !override [] }
  mongo: { restart: unless-stopped, ports: !override [] }
  mailpit: { restart: unless-stopped, ports: !override [] }
